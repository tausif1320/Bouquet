<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌹 A flower for my beautiful flower</title>
    <meta name="description" content="A glowing night garden blooming from code.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@500;700&family=Fira+Code:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="vignette"></div>
    <div class="ambient-light" id="ambientLight"></div>
    <div id="fireflies"></div>

    <div class="trigger-overlay" id="triggerOverlay">
        <div class="glass-card">
            <div class="card-glow"></div>
            <div class="rose-icon">🌹</div>
            <h2 class="title">A flower for my beautiful flower (aalu)</h2>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <p class="status-text" id="statusText">Ready to compile...</p>
            <button class="start-button" id="startButton" disabled>
                <span class="btn-text">Tap to Bloom</span>
                <span class="btn-shine"></span>
            </button>
        </div>
    </div>

    <!-- grass, leaves, curved stems and flowers are all generated by script.js -->
    <div class="stage" id="stage"></div>

    <div class="end-text" id="endText">
        <p class="tagline" id="tagline">to the most beautiful of them all</p>
        <span class="rose-emoji">🌹</span>
    </div>

    <div id="fallingPetals"></div>

    <script src="script.js"></script>
</body>

</html>
